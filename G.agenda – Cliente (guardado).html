<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G.agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8F2;--surface:#fff;--ink:#2B1A0E;--muted:#7A6657;--line:#F0DDD0;--brand:#FE6A00;--brand-ink:#1F1100;--brandtx:#B34700;--soft:#FFEBDD;--taken:#F3E9E1;--ok:#1E8E5A;--warn:#B45F06;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110C;--surface:#231A13;--ink:#F7EFE8;--muted:#B9A898;--line:#3A2C20;--brand:#FF7A1A;--brand-ink:#1F1100;--brandtx:#FF9A4D;--soft:#34231A;--taken:#2C211A;--ok:#4CC38A;--warn:#F2B45C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110C;--surface:#231A13;--ink:#F7EFE8;--muted:#B9A898;--line:#3A2C20;--brand:#FF7A1A;--brand-ink:#1F1100;--brandtx:#FF9A4D;--soft:#34231A;--taken:#2C211A;--ok:#4CC38A;--warn:#F2B45C;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:20px;margin:0}.brand{display:flex;align-items:center;gap:10px}.logo{height:34px;width:auto;display:block}h2{font-size:22px;margin:18px 0 4px;line-height:1.2}
p{margin:0;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
button{font:inherit;color:inherit}
.dots{display:flex;gap:6px;margin:10px 0 0}.dots i{flex:1;height:4px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--brand)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;cursor:pointer}
.opt b{display:block;font-weight:700}.opt span{color:var(--muted);font-size:14px}
.opt.on{border-color:var(--brand);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--soft);font-weight:500}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin-top:8px}
.day{flex:0 0 auto;min-width:64px;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer}
.day b{display:block;font-size:20px;line-height:1.1}.day span{font-size:13px;color:var(--muted)}
.day.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.day.on span{color:var(--brand-ink)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;cursor:pointer;font-size:15px}
.slot.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.slot:disabled{background:var(--taken);color:var(--muted);text-decoration:line-through;cursor:not-allowed;border-color:var(--taken)}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 5px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:14px}
.check input{margin-top:3px;accent-color:var(--brand)}
.bar{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.ghost{flex:0 0 auto;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:500;padding:14px 18px}
.err{color:var(--warn);font-size:14px;margin-top:10px;min-height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--brandtx);font-weight:700}
.tag.new{background:var(--brand);color:var(--brand-ink)}
.mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini a,.mini button{font-size:14px;border:1.5px solid var(--line);background:none;border-radius:9px;padding:6px 11px;text-decoration:none;color:var(--ink);cursor:pointer}
.mini .on{background:var(--soft);border-color:var(--brand)}
.dh{font-weight:700;margin:20px 0 0;font-size:15px;color:var(--muted)}
.ok{color:var(--ok);font-weight:700}.late{color:var(--warn);font-weight:700}
.big{text-align:center;padding:26px 8px 6px}.big .ic{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92%;z-index:5}
.step{display:flex;align-items:center;gap:12px}.step button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
input[type=text].pr{width:90px;display:inline-block;padding:7px 10px}
.mini a.wa{background:#1E8E5A;border-color:#1E8E5A;color:#fff;font-weight:500}
.cx{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.seg4 button{padding:8px 2px;font-size:13px}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700;color:#fff;margin-left:6px;vertical-align:1px}.pill.hj{background:#C62828}.pill.am{background:#C25400}
.mini a.rm{border-color:#1E8E5A;color:var(--ok);font-weight:500}
.opt .em{font-size:30px;line-height:1;color:inherit}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:22px;line-height:1;cursor:pointer}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px}
.mini button.has{background:#1565C0;border-color:#1565C0;color:#fff}
.mini button.danger{background:#C62828;border-color:#C62828;color:#fff}
.wbtn{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;border-radius:16px;background:#167A4B;color:#fff;text-decoration:none;box-shadow:0 6px 16px rgba(22,122,75,.28)}.wbtn b{display:block;font-size:17px}.wbtn small{display:block;font-size:13px;opacity:.92}.wi{font-size:28px;line-height:1}.chip.del{color:var(--warn);border-color:var(--warn)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.cats .opt{margin-top:0;text-align:center;padding:12px 8px}.cats .em{display:block;margin-bottom:4px}
.nt{margin-top:8px;font-size:14px;color:var(--ink);background:var(--soft);border-radius:10px;padding:8px 10px}
.cn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}.cn:disabled{opacity:.4;cursor:not-allowed}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cg i{font-style:normal;font-size:12px;color:var(--muted);text-align:center}
.cd{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:15px;cursor:pointer;padding:0}.cd.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.cd:disabled{background:transparent;border-color:transparent;color:var(--muted);opacity:.45;cursor:not-allowed}.mini button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>

<script>

var HORAS=["08:00","09:00","10:00","11:00","13:00","14:00","15:00","16:00"];
var WD=["dom","seg","ter","qua","qui","sex","sáb"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var DIAS=[];(function(){var d=new Date();while(DIAS.length<14){d.setDate(d.getDate()+1);DIAS.push({iso:iso(d),n:d.getDate(),w:WD[d.getDay()],dow:d.getDay(),full:WD[d.getDay()]+", "+d.getDate()+"/"+String(d.getMonth()+1).padStart(2,"0")})}})();
var CFG={sv:{visita:{on:1,p:80,u:0},hig:{on:1,p:150,u:1},inst:{on:1,p:400,u:1},desi:{on:1,p:150,u:1},gas:{on:1,p:250,u:1},ele:{on:1,p:100,u:0},orc:{on:1,p:0,u:0},pre:{on:1,p:200,u:0},outro:{on:0,p:0,u:0}},dw:[1,2,3,4,5,6],hs:HORAS.slice()};
function avail(){return DIAS.filter(function(d){return CFG.dw.indexOf(d.dow)>-1}).slice(0,6)}
function brl(n){return "R$ "+Number(n||0).toLocaleString("pt-BR")}
function dlabel(i){var p=i.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return WD[d.getDay()]+", "+d.getDate()+"/"+String(d.getMonth()+1).padStart(2,"0")}

bk:[{id:1,key:DIAS[0].iso+" 08:00",name:"Carlos Mendes",tel:"67999990001",svc:"Higienização",who:"Pessoal",addr:"Rua 14 de Julho, 1200, Centro, Campo Grande MS",obs:"Moro em apartamento, bloco B"},
{id:2,key:DIAS[0].iso+" 10:00",name:"Padaria Estrela",tel:"67999990002",ct:"Rita",svc:"Instalação",who:"Empresa",addr:"Av. Afonso Pena, 3400, Campo Grande MS",obs:"Falar com a Dona Rita. Abre às 6h."},
{id:3,key:DIAS[1].iso+" 09:00",name:"Fernanda Lima",tel:"67999990003",svc:"Recarga de gás",who:"Pessoal",addr:"Rua Pedro Celestino, 850, Campo Grande MS",obs:"Moro em casa"},{id:4,key:iso(new Date())+" 14:00",name:"Clínica Vida",tel:"67999990004",ct:"Marta",svc:"Higienização",who:"Empresa",addr:"Rua Rio Grande do Sul, 410, Campo Grande MS",obs:"Entrar pela recepção",q:3,val:450}],
cl:[{id:1,name:"Maria Souza",svc:"Higienização",ago:182,iv:180},{id:2,name:"Padaria Estrela",svc:"Manutenção preventiva",ago:78,iv:90},{id:3,name:"João Pereira",svc:"Recarga de gás",ago:200,iv:365}],nid:10};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function taken(k){return S.bk.some(function(b){return b.key===k})}
function toast(t){var e=document.getElementById("toast");e.innerHTML='<div class="toast">'+esc(t)+"</div>";setTimeout(function(){e.innerHTML=""},2800)}
function dots(){var h='<div class="dots">';for(var i=0;i<5;i++)h+='<i class="'+(i<=S.step?"on":"")+'"></i>';return h+"</div>"}
function bar(next,label,back){return '<div class="bar">'+(back?'<button class="btn ghost" data-act="back">Voltar</button>':"")+'<button class="btn" data-act="'+next+'">'+label+"</button></div>"}
function cli(){
 var h="";
 if(S.step===0){
  h=dots()+"<h2>Para quem é o serviço?</h2><p>Assim o técnico já sabe como atender.</p>"+
  '<button class="opt" data-act="who" data-v="Pessoal"><b>Pessoal</b><span>Minha casa ou apartamento</span></button>'+
  '<button class="opt" data-act="who" data-v="Empresa"><b>Empresa</b><span>Loja, escritório, consultório ou indústria</span></button>';
 }else if(S.step===1){
  h=dots()+"<h2>Seu problema é com:</h2><p>Escolha o aparelho.</p>";
  for(var ck in CATS)h+='<button class="opt'+(S.cat===ck?" on":"")+'" data-act="cat" data-v="'+ck+'"><div class="row" style="justify-content:flex-start;align-items:center;gap:14px"><span class="em">'+CATS[ck].e+"</span><b>"+CATS[ck].n+"</b></div></button>";
  h+='<div class="bar"><button class="btn ghost" data-act="back">Voltar</button></div>';
 }else if(S.step===2){
  h=dots()+"<h2>Qual serviço você precisa?</h2><p>Se não souber, escolha a visita técnica.</p>";
  for(var k in SERV){var c=CFG.sv[k];if(!c.on)continue;if(S.cat&&(c.cat?c.cat!==S.cat:CATS[S.cat].s.indexOf(k)<0))continue;h+='<button class="opt'+(S.svc===k?" on":"")+'" data-act="svc" data-v="'+k+'"><div class="row"><b>'+SERV[k][0]+"</b><b>"+(c.p?brl(c.p)+(c.u?" /aparelho":""):"A combinar")+"</b></div><span>"+SERV[k][1]+"</span></button>"}

  h+='<div class="err">'+S.err+"</div>"+bar("next","Continuar",1);
 }else if(S.step===3){
  h=dots()+"<h2>Escolha o dia e o horário</h2><p>Dias apagados não têm vaga. Horários riscados já foram reservados.</p>";

  h+='<div class="err">'+S.err+"</div>"+bar("next","Continuar",1);
 }else if(S.step===4){
  h=dots()+"<h2>Onde será o atendimento?</h2>";
  if(S.who==="Empresa")h+='<label>Nome da empresa</label><input type="text" data-f="emp" value="'+esc(S.emp)+'"><label>CNPJ</label><input type="text" data-f="cnpj" inputmode="numeric" value="'+esc(S.cnpj)+'"><label>Pessoa de contato</label><input type="text" data-f="cont" value="'+esc(S.cont)+'">';
  else h+='<label>Seu nome</label><input type="text" data-f="cont" value="'+esc(S.cont)+'">';

function seg3(){function t(v,l){return '<button style="flex:1" class="'+(S.tab===v?"on":"")+'" data-act="tab" data-v="'+v+'">'+l+"</button>"}return '<div class="seg seg4" style="margin-top:10px">'+t("agenda","Agenda")+t("lemb","Retornos ("+S.cl.filter(function(c){return c.iv-c.ago<=15}).length+")")+t("agendar","Agendar")+t("cfg","Ajustes")+"</div>"}

 h+='<h2 style="font-size:18px">Dias que você atende</h2><div class="chips">';
 [1,2,3,4,5,6,0].forEach(function(d){h+='<button class="chip'+(CFG.dw.indexOf(d)>-1?" on":"")+'" data-act="dw" data-v="'+d+'">'+WD[d]+"</button>"});
 h+='</div><h2 style="font-size:18px">Horários disponíveis</h2><div class="chips">';
 HORAS.forEach(function(t){h+='<button class="chip'+(CFG.hs.indexOf(t)>-1?" on":"")+'" data-act="hr" data-v="'+t+'">'+t+"</button>"});
 return h+'</div><p style="margin-top:12px">Essas escolhas valem na hora para a visão do cliente.</p>'}
function render(){
 document.getElementById("r-cli").className=S.role==="cli"?"on":"";document.getElementById("r-tec").className=S.role==="tec"?"on":"";
 document.getElementById("app").innerHTML=S.role==="cli"?cli():tec();
}
function go(n){S.step=n;S.err="";render();window.scrollTo(0,0)}
function reset(){S.q=1;S.cat="";S.tel="";S.step=0;S.who="";S.svc="";S.sym=[];S.day="";S.slot="";S.addr="";S.obs="";S.emp="";S.cnpj="";S.cont="";S.err=""}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,v=b.dataset.v;
 if(a==="role"){S.role=v;render();window.scrollTo(0,0);return}
 if(a==="who"){S.who=v;go(1);return}
 if(a==="svc"){S.svc=v;S.err="";render();return}
 if(a==="sym"){var i=S.sym.indexOf(v);i>-1?S.sym.splice(i,1):S.sym.push(v);render();return}
 if(a==="day"){S.day=v;S.slot="";S.err="";render();return}
 if(a==="slot"){S.slot=v;S.err="";render();return}
 if(a==="obs"){S.obs=(S.obs?S.obs+(S.obs.slice(-1)==="."?" ":". "):"")+v+".";render();return}
 if(a==="back"){go(S.step-1);return}
 if(a==="next"){
  if(S.step===2&&!S.svc){S.err="Escolha um serviço para continuar.";render();return}
  if(S.step===3&&!S.slot){S.err="Escolha um dia e um horário.";render();return}
  go(S.step+1);return}
 if(a==="book"){
  if(!S.addr.trim()||!S.cont.trim()||S.tel.replace(/\D/g,"").length<10||(S.who==="Empresa"&&!S.emp.trim())){S.err="Preencha nome, WhatsApp com DDD e endereço"+(S.who==="Empresa"?", além do nome da empresa":"")+".";render();return}
  var sv=SERV[S.svc][0],ob=S.obs.trim();
  if(S.svc==="visita"&&S.sym.length)ob=("Sintomas: "+S.sym.join(", ")+(ob?". "+ob:""));
  var cf=CFG.sv[S.svc],q=cf.u?S.q:1;S.last={id:S.nid++,key:S.day+" "+S.slot,name:S.who==="Empresa"?S.emp:S.cont,svc:sv,who:S.who,addr:S.addr,tel:S.tel,ct:S.cont,ap:S.cat?CATS[S.cat].n:"",obs:ob,q:cf.u?q:0,val:cf.p*q,nw:true};
  S.bk.push(S.last);go(5);return}
 if(a==="again"){reset();go(0);return}
 if(a==="nsv"){S.nsv="";render();return}
 if(a==="nsvx"){S.nsv=null;render();return}
 if(a==="nsvok"){var nn=(S.nsv||"").trim();if(!nn){toast("Escreva o nome do serviço.");return}var ck2="c"+S.nid++;SERV[ck2]=[nn,"Serviço personalizado"];CFG.sv[ck2]={on:1,p:0,u:0,rv:0,cu:1,cat:S.ccat};S.nsv=null;render();toast("Serviço adicionado. Defina o valor abaixo.");return}
 if(a==="ac"){var cs=CFG.sv[v];if(cs.ac){cs.ac=0;cs.p=cs.pp||0}else{cs.pp=cs.p;cs.p=0;cs.ac=1}render();return}
 if(a==="ccat"){S.ccat=S.ccat===v?"":v;S.nsv=null;S.sdel=null;render();return}
 if(a==="svdq"){S.sdel=v;render();return}
 if(a==="svdx"){S.sdel=null;render();return}
 if(a==="svdel"){var cc=S.ccat;if(CFG.sv[v]&&CFG.sv[v].cat){delete SERV[v];delete CFG.sv[v]}else{CATS[cc].s=CATS[cc].s.filter(function(x){return x!==v});if(!Object.keys(CATS).some(function(z){return CATS[z].s.indexOf(v)>-1})){delete SERV[v];delete CFG.sv[v]}}if(S.svc===v)S.svc="";if(S.m.svc===v)S.m.svc="";S.sdel=null;render();toast("Serviço excluído.");return}
 if(a==="cat"){S.cat=v;S.svc="";S.sym=[];go(2);return}
 if(a==="served"){var sc=S.cl.filter(function(x){return x.id===+v})[0];if(!sc)return;var s0=sk(sc.svc);if(s0&&CFG.sv[s0].rv)sc.iv=CFG.sv[s0].rv;sc.ago=0;render();toast(sc.name+" atendido. Volta para o fim da lista: próximo retorno em "+rvl(sc.iv)+".");return}
 if(a==="rv"){CFG.sv[b.dataset.k].rv=+v;render();return}
 if(a==="nt"){S.nt=S.nt===v?null:v;render();return}
 if(a==="rt"){S.rt={id:+v,day:"",slot:"",why:"",err:""};S.cx=null;render();return}
 if(a==="rts"){S.rt.slot=v;S.rt.err="";render();return}
 if(a==="rtw"){S.rt.why=(S.rt.why?S.rt.why+". ":"")+v;render();return}
 if(a==="rtx"){S.rt=null;render();return}
 if(a==="rtok"){var rb=S.bk.filter(function(x){return x.id===S.rt.id})[0],r=S.rt;if(!rb)return;if(!r.day||!r.slot){r.err="Escolha o dia e o horário do retorno.";render();return}
  (rb.hist=rb.hist||[]).push("Visita em "+dlabel(rb.key.slice(0,10))+" às "+rb.key.slice(11)+(r.why?": "+r.why:""));
  rb.key=r.day+" "+r.slot;rb.ret=1;rb.rn=r.why;rb.nw=false;S.rt=null;render();toast("Retorno marcado para "+dlabel(r.day)+" às "+r.slot+". Veja em Retornos.");return}
 if(a==="mm"){var nm=S.mo.m+ +v,ny=S.mo.y;if(nm<0){nm=11;ny--}if(nm>11){nm=0;ny++}S.mo={y:ny,m:nm};render();return}
 if(a==="ms"){var kk=b.dataset.k;S.m[kk]=v;if(kk==="day")S.m.slot="";if(kk==="svc"){S.m.q=1;S.m.val=null}S.m.err="";render();return}
 if(a==="mq"){S.m.q=Math.max(1,Math.min(20,S.m.q+ +v));S.m.val=null;render();return}
 if(a==="msave"){var m=S.m;if(!m.name.trim()||!m.addr.trim()||!m.slot||!SERV[m.svc]){m.err="Preencha nome, serviço, endereço, dia e horário.";render();return}
  var cf2=CFG.sv[m.svc],q2=cf2.u?m.q:1;
  S.bk.push({id:S.nid++,key:m.day+" "+m.slot,name:m.name.trim(),tel:m.tel,svc:SERV[m.svc][0],who:m.who,addr:m.addr.trim(),obs:m.obs.trim(),q:cf2.u?q2:0,val:pv(m.val)!==null?pv(m.val):cf2.p*q2,nw:true});
  S.m=newM();S.tab="agenda";render();toast("Agendamento salvo na sua agenda.");return}
 if(a==="cx"){S.cx={id:+v,r:"",n:0};render();return}
 if(a==="cxr"){S.cx.r=v;S.cx.n=0;render();return}
 if(a==="cxn"){S.cx.n=1;setTimeout(render,400);return}
 if(a==="cxx"){S.cx=null;render();return}
 if(a==="cxok"){var cb=S.bk.filter(function(x){return x.id===S.cx.id})[0];if(!S.cx.n||!cb)return;S.bk=S.bk.filter(function(x){return x.id!==cb.id});S.sel=S.sel.filter(function(x){return x!==cb.id});S.cx=null;render();toast("Visita cancelada. O horário ficou livre para outros clientes.");return}
 if(a==="qm"){S.q=Math.max(1,S.q-1);render();return}
 if(a==="qp"){S.q=Math.min(20,S.q+1);render();return}
 if(a==="svon"){CFG.sv[v].on=CFG.sv[v].on?0:1;render();return}
 if(a==="dw"){var n=+v,z=CFG.dw.indexOf(n);z>-1?CFG.dw.splice(z,1):CFG.dw.push(n);render();return}
 if(a==="hr"){var z2=CFG.hs.indexOf(v);z2>-1?CFG.hs.splice(z2,1):CFG.hs.push(v);CFG.hs.sort();render();return}
 if(a==="tab"){S.tab=v;render();return}
 if(a==="sel"){var id=+v,j=S.sel.indexOf(id);j>-1?S.sel.splice(j,1):S.sel.push(id);render();return}
 if(a==="done"){var id2=+v,bb=S.bk.filter(function(x){return x.id===id2})[0];
  S.bk=S.bk.filter(function(x){return x.id!==id2});S.sel=S.sel.filter(function(x){return x!==id2});
  var sk0=sk(bb.svc),iv=sk0?CFG.sv[sk0].rv:0;
  if(iv){S.cl.push({id:S.nid++,name:bb.name,svc:bb.svc,ago:0,iv:iv,note:bb.note});toast(bb.name+" salvo(a) nos lembretes: retorno em "+rvl(iv))}else toast("Serviço concluído");
  render();return}
 if(a==="snooze"){S.cl.forEach(function(c){if(c.id===+v)c.iv+=30});render();toast("Prazo adiado em 30 dias")}
});
